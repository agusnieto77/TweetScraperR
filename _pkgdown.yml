url: https://agusnieto77.github.io/TweetScraperR/

template:
  bootstrap: 5
  bslib:
    primary: "#1d9bf0"

reference:
- title: "Sesión, pool de cuentas y motor"
  desc: >
    Instalar el motor de Node.js/Playwright e importar tus sesiones reales de X
    a partir de las cookies del navegador. Con varias cuentas, la recolección
    rota sola cuando una agota el cupo de X.
  contents:
  - importSessionX
  - setupAccountsX
  - addAccountsX
  - accountsX
  - setProxyX
  - checkAccountsX
  - reactivateAccountX
  - resetLocksX
  - removeAccountX
  - installPlaywrightEngine
  - checkPlaywrightEngine
  - loginX

- title: "Scraping de tweets (API)"
  desc: >
    Consultan la API GraphQL interna de X y devuelven datos estructurados desde
    JSON (texto completo, métricas, media, hashtags, menciones, etc.).
  contents:
  - getUserTweetsAPI
  - getTweetsTimelinesAPI
  - getTweetsSearchAPI
  - getTweetsLiveAPI
  - getTweetsHistoricalAPI
  - getTweetsThreadsAPI
  - readTweetsDB
  - getTweetsRepliesAPI
  - getTweetsDataAPI
  - getUserMediaAPI
  - getListTweetsAPI

- title: "Usuarios y redes (API)"
  contents:
  - getUsersDataAPI
  - getUsersAboutAPI
  - getUsersSearchAPI
  - getUserFollowersAPI
  - getUserFollowingAPI
  - getTweetsRetweetsAPI
  - getListMembersAPI

- title: "Visualización"
  contents:
  - plotTime
  - plotWords
  - plotEmojis
  - plotEmojisPNG

- title: "Análisis y utilidades"
  contents:
